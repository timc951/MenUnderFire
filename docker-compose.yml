services:
  # Combined frontend + Go backend in a single container
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_AUTH_PUBLISHABLE_KEY: ${VITE_AUTH_PUBLISHABLE_KEY}
        VITE_DEBUG_BUILD: ${VITE_DEBUG_BUILD:-false}
        VITE_HIT_TOKEN: ${HIT_TOKEN}
    container_name: menunderfire-app
    ports:
      - "8001:8080"
    environment:
      # Go backend configuration
      SERVER_PORT: 7001
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-menunderfire}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-none}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      HIT_TOKEN: ${HIT_TOKEN}
      AGREEMENT_HMAC_SECRET: ${AGREEMENT_HMAC_SECRET}
    networks:
      - menunderfire-network
      - proxy
      - cloudflare-tunnel
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: menunderfire-postgres
    ports:
      - "5432:5432"
    command: >
      sh -c "
      cp /tmp/certs/server.crt /var/lib/postgresql/server.crt &&
      cp /tmp/certs/server.key /var/lib/postgresql/server.key &&
      chmod 600 /var/lib/postgresql/server.key &&
      chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key &&
      exec docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      "
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-menunderfire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/server.crt:/tmp/certs/server.crt:ro
      - ./certs/server.key:/tmp/certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-menunderfire}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - menunderfire-network

volumes:
  postgres_data:

networks:
  menunderfire-network:
    driver: bridge
  proxy:
    external: true
  cloudflare-tunnel:
    external: true
